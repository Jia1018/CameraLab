seed: 17

dataset:
  root: /workspace/writeable/datasets/CamXTime
  num_frames: 16
  crop_size: 384
  camera_stride: 2
  time_stride: 2
  tubelet_size: 2
  samples_per_epoch: 500
  expected_grid_size: 120

backbone:
  repo_path: /workspace/code/vjepa2
  model_name: vjepa2_1_vit_base_384
  checkpoint_path: /workspace/writeable/checkpoints/vjepa2/vjepa2_1_vitb_dist_vitG_384.pt
  patch_size: 16

model:
  model_dim: 384
  depth: 2
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  max_temporal_tokens: 32

reconstructor:
  camera_conditioning: spatial_basis_film
  max_spatial_tokens: 576
  spatial_basis_rank: 16

loss:
  reconstruction: 1.0
  cosine: 0.1
  camera_supervision: 0.0
  camera_invariance: 0.05
  content_invariance: 0.1
  identity_reconstruction: 0.25
  content_swap_reconstruction: 2.0
  camera_swap_reconstruction: 0.25
  double_swap_reconstruction: 2.0
  camera_factor_ranking: 0.1
  content_factor_ranking: 0.2
  factor_margin: 0.05
  camera_variance: 0.1
  camera_std_target: 0.1
  camera_delta_reconstruction: 4.0
  content_delta_reconstruction: 1.0

train:
  batch_size: 1
  num_workers: 2
  learning_rate: 0.0001
  weight_decay: 0.05
  steps: 500
  log_every: 10
  save_every: 100
  output_dir: /workspace/writeable/checkpoints/camera_motion_disentangle/third_wave/b5_spatial_basis_film_camdelta4_seed17
  dtype: bfloat16
