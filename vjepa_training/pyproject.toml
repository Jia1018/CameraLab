[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-motion-disentangle"
version = "0.1.0"
description = "Camera and physical-motion disentanglement on frozen video features"
requires-python = ">=3.10"
dependencies = [
  "av>=12",
  "einops>=0.7",
  "numpy>=1.24",
  "PyYAML>=6",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["camdis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
